# Продакшен-стек для VPS.
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Примечание: PostgreSQL здесь нет — код пока работает на SQLite
# (см. lib/src/database/database.dart). Volume backend_data сохраняет
# базу между пересозданиями контейнера.

services:
  backend:
    image: assistant-backend:latest
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY}
      HOST: 0.0.0.0
      PORT: "8081"
      # Куда писать SQLite-базу (путь внутри контейнера, смонтирован в volume)
      DATA_DIR: /app/data
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8081:8081"

  mcp:
    image: assistant-mcp:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8081/api/v1
      API_KEY: ${API_KEY}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8082"
      MCP_PATH: ${MCP_SECRET_PATH}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  backend_data:
