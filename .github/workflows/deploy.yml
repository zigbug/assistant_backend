name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # позволяет запускать вручную из GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout backend
        uses: actions/checkout@v4

      - name: 🐳 Build backend image
        run: docker build -t assistant-backend:latest .

      - name: 📥 Checkout MCP (соседний репо)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/assistant_mcp
          path: assistant_mcp

      - name: 🐳 Build MCP image
        run: docker build -t assistant-mcp:latest ./assistant_mcp

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Transfer images to VPS
        run: |
          docker save assistant-backend:latest assistant-mcp:latest \
            | ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "docker load"

      - name: 📂 Transfer compose file
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/assistant"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/assistant/

      - name: 🚀 Deploy via docker compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          MCP_SECRET_PATH: ${{ secrets.MCP_SECRET_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_EOF'
            set -e
            cd /opt/assistant
            
            # Создаём .env из переменных окружения (idempotent)
            cat > .env << ENV_EOF
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            API_KEY=$API_KEY
            MCP_SECRET_PATH=$MCP_SECRET_PATH
            ENV_EOF
            chmod 600 .env
            
            # Поднимаем стек
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Ждём старта БД и показываем статус
            sleep 5
            docker compose -f docker-compose.prod.yml ps
          DEPLOY_EOF

      - name: ✅ Health check
        run: |
          sleep 10
          echo "Проверяем, что бэкенд отвечает..."
          curl -f -k https://assistant.905911.ru:8444/health || (echo "❌ Backend not responding" && exit 1)
          echo "✅ Backend is up!"